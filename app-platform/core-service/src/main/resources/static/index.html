<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>YourApp</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
    code { background: #f2f2f2; padding: 0.2rem 0.4rem; border-radius: 4px; }
  </style>
  <script>
    async function ping() {
      const res = await fetch('/api/health');
      const json = await res.json();
      document.getElementById('health').textContent = JSON.stringify(json);
    }
    window.addEventListener('DOMContentLoaded', ping);
  </script>
  </head>
  <body>
    <h1>YourApp UI</h1>
    <p>Static placeholder. Replace with Angular dist.</p>
    <p>Health: <code id="health">(loading)</code></p>
  </body>
</html>
