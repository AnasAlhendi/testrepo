server:
  port: 19080
spring:
  application:
    name: tp-server
  security:
    user:
      name: anas
      password: "{noop}123"
      roles: ADMIN,READER

# Example TP config location and defaults (placeholder)
tp:
  home: "${user.home}/.local/share/TargetPlatform"
  autoStart: true
  configPath: "${tp.home}/config/tp-config.yml"
  registry:
    url: "" # e.g. http://127.0.0.1:8082/api
    autoSyncOnStart: false
  keys:
    publicKeyPath: "" # path to X.509 PEM public key used to verify registry catalog signature
  security:
    enabled: false
    headerName: X-API-Key
    readKeys: []   # e.g. ["READ_KEY_ABC"]
    adminKeys: []  # e.g. ["ADMIN_KEY_DEF"]
